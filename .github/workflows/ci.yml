name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — no value in finishing a
# run for a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci`, not `install`: fails loudly if package-lock.json and package.json
      # have drifted, rather than quietly resolving a different tree than the
      # one that was tested locally.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last, because it is the slowest and the three checks above localise a
      # failure far better than a build log does.
      - name: Build
        run: npm run build
