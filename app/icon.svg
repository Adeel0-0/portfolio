<!-- Palette mirrors the --rb-* tier in app/globals.css. A static asset can't
     read CSS custom properties, so recolouring the site means editing this file
     alongside globals.css and app/opengraph-image.tsx. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#070B18" />
  <text
    x="50%"
    y="46%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#E8ECF5"
  >A</text>
  <!-- Livery stripe. Doubles as the underline of the mark at favicon sizes,
       where the glyph alone reads as any generic "A". -->
  <rect x="18" y="46" width="28" height="5" rx="2.5" fill="#E1112C" />
</svg>
